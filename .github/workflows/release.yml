name: Production Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

# Grant permissions needed to create GitHub Releases and upload assets
permissions:
  contents: write

jobs:
  build-and-release:
    # 1. Only run if the PR was MERGED
    # 2. Only run if the PR originated from the 'dev' branch
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'dev'

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'macos-latest' # Apple Silicon (M1/M2/M3/M4)
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # Intel Macs
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Install macos targets on macos runners
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Smart caching for Rust to drastically speed up CI build times
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Install WebKit/GTK header dependencies on Ubuntu
      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install Frontend Dependencies
        run: npm ci

      # On Ubuntu, tauri-action only builds/releases .deb and .rpm here.
      # The AppImage is built and fixed separately below, then appended to
      # this same release, because it needs a post-build patch that
      # tauri-action's all-in-one build+publish step doesn't allow for.
      # Windows and macOS legs are completely unaffected and behave exactly
      # as before.
      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Monochrome Desktop v__VERSION__'
          releaseBody: |
            ### Automated Release
            * Merged from `dev` into `main`.
            * Native installers for Windows, Linux, Apple Silicon, and Intel Macs.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.platform == 'ubuntu-22.04' && '--bundles deb,rpm' || matrix.args }}

      # --- EGL_BAD_PARAMETER fix (Ubuntu/AppImage only) ----------------------
      # Confirmed root cause: the AppImage bundles Ubuntu 22.04's own
      # libwayland-client/cursor/egl/server libraries via linuxdeploy. On
      # systems with a much newer Wayland/Mesa stack (e.g. Arch/CachyOS),
      # these bundled libraries are version-mismatched against the host's
      # compositor, causing WebKitGTK to fail EGL initialization with
      # "Could not create default EGL display: EGL_BAD_PARAMETER" and a
      # blank white window — even though the exact same build works fine
      # when done locally on a matching system.
      #
      # Fix: build the AppImage separately, delete the bundled
      # libwayland-*.so* files so the binary falls through to the host's
      # own matching copies at runtime, repack, then upload it to the same
      # release tauri-action already created above.
      - name: Build AppImage separately (Linux only)
        if: matrix.platform == 'ubuntu-22.04'
        run: npm run tauri build -- --bundles appimage

      - name: Strip bundled libwayland libraries from AppImage
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -n1)
          echo "Repacking: $APPIMAGE"

          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract
          rm "$APPIMAGE"

          find squashfs-root \( \
            -path "*/libwayland-client.so*" -o \
            -path "*/libwayland-cursor.so*" -o \
            -path "*/libwayland-egl.so*" -o \
            -path "*/libwayland-server.so*" \
          \) -print -delete

          # appimagetool releases on the legacy AppImageKit repo 404 —
          # pull from the maintained AppImage/appimagetool repo instead.
          curl -L -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool

          # No FUSE available on GitHub-hosted runners.
          ./appimagetool --appimage-extract-and-run squashfs-root "$APPIMAGE"

      - name: Get app version (Linux only)
        if: matrix.platform == 'ubuntu-22.04'
        id: appversion
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload fixed AppImage to release (Linux only)
        if: matrix.platform == 'ubuntu-22.04'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.appversion.outputs.version }}
          files: src-tauri/target/release/bundle/appimage/*.AppImage
